test_cases:
  - id: "SEC-001"
    category: "Authentication Security & JWT Validation"
    name: "JWT Signature Verification"
    description: "Verify API rejects JWT token with forged or tampered signature"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, invalid token"
  - id: "SEC-002"
    category: "Authentication Security & JWT Validation"
    name: "JWT Algorithm None Attack"
    description: "Verify API rejects JWT token configured with alg='none'"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, invalid token algorithm"
  - id: "SEC-003"
    category: "Authentication Security & JWT Validation"
    name: "JWT Expired Token Rejection"
    description: "Verify API rejects JWT token with expired exp timestamp"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, token expired"
  - id: "SEC-004"
    category: "Authentication Security & JWT Validation"
    name: "JWT Not Before Claim Handling"
    description: "Verify API rejects JWT token with future nbf timestamp"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, token not active"
  - id: "SEC-005"
    category: "Authentication Security & JWT Validation"
    name: "JWT Secret Entropy & Strength"
    description: "Verify JWT_SECRET is not a trivial dictionary word (e.g. 'secret')"
    priority: "Critical"
    expected_result: "JWT secret meets minimum entropy requirements (>= 256-bit)"
  - id: "SEC-006"
    category: "Authentication Security & JWT Validation"
    name: "JWT Missing Header Rejection"
    description: "Submit request to protected route with Authorization header absent"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, no token provided"
  - id: "SEC-007"
    category: "Authentication Security & JWT Validation"
    name: "JWT Malformed Header Format"
    description: "Submit request with header 'Authorization: InvalidFormatToken'"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, malformed authorization header"
  - id: "SEC-008"
    category: "Authentication Security & JWT Validation"
    name: "JWT Empty Bearer Token"
    description: "Submit request with header 'Authorization: Bearer '"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, token missing"
  - id: "SEC-009"
    category: "Authentication Security & JWT Validation"
    name: "JWT Non-Bearer Scheme Rejection"
    description: "Submit request with header 'Authorization: Basic dXNlcjpwYXNz'"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, invalid auth scheme"
  - id: "SEC-010"
    category: "Authentication Security & JWT Validation"
    name: "JWT Symmetric vs Asymmetric Confusion"
    description: "Test HMAC key confusion attack if public key is exposed"
    priority: "High"
    expected_result: "Algorithm confusion attack fails"
  - id: "SEC-011"
    category: "Authentication Security & JWT Validation"
    name: "Bcrypt Password Hashing Standard"
    description: "Verify user passwords are saved using bcrypt with salt rounds >= 10"
    priority: "Critical"
    expected_result: "Passwords stored as valid bcrypt hashes ($2a$, $2b$, or $2y$)"
  - id: "SEC-012"
    category: "Authentication Security & JWT Validation"
    name: "Password Plaintext Storage Prevention"
    description: "Inspect database records to confirm zero plaintext passwords exist"
    priority: "Critical"
    expected_result: "Zero plaintext passwords in user records"
  - id: "SEC-013"
    category: "Authentication Security & JWT Validation"
    name: "Password Hash Exposure In User API"
    description: "Verify GET /api/auth/user does NOT return password hash field"
    priority: "Critical"
    expected_result: "Password field stripped from user response object"
  - id: "SEC-014"
    category: "Authentication Security & JWT Validation"
    name: "Password Hash Exposure In Signup API"
    description: "Verify POST /api/auth/signup does NOT return password hash field"
    priority: "Critical"
    expected_result: "Password field excluded from registration response"
  - id: "SEC-015"
    category: "Authentication Security & JWT Validation"
    name: "Password Hash Exposure In Login API"
    description: "Verify POST /api/auth/login does NOT return password hash field"
    priority: "Critical"
    expected_result: "Password field excluded from login response"
  - id: "SEC-016"
    category: "Authentication Security & JWT Validation"
    name: "Brute Force Rate Limiting Login"
    description: "Attempt 20 rapid incorrect logins for the same account"
    priority: "High"
    expected_result: "Rate limiting or throttling slows brute force attempts"
  - id: "SEC-017"
    category: "Authentication Security & JWT Validation"
    name: "Timing Attack Resistance On Login"
    description: "Measure response time for existing vs nonexistent email login"
    priority: "Medium"
    expected_result: "Response times are balanced to prevent user enumeration"
  - id: "SEC-018"
    category: "Authentication Security & JWT Validation"
    name: "Credential Stuffing Defense"
    description: "Test bulk automated credential submissions against auth endpoint"
    priority: "High"
    expected_result: "System resists automated credential stuffing"
  - id: "SEC-019"
    category: "Authentication Security & JWT Validation"
    name: "Password Minimum Length Policy"
    description: "Verify signup rejects passwords shorter than 6 characters"
    priority: "High"
    expected_result: "HTTP 400 Bad Request, password too short"
  - id: "SEC-020"
    category: "Authentication Security & JWT Validation"
    name: "Password Maximum Length Handling"
    description: "Submit password with 10,000 characters to test DoS resilience"
    priority: "Medium"
    expected_result: "Server truncates or rejects oversized password without CPU hang"
  - id: "SEC-021"
    category: "Authentication Security & JWT Validation"
    name: "Credential Leakage In URL Prevention"
    description: "Verify credentials are never accepted or transmitted via URL query params"
    priority: "High"
    expected_result: "Only POST request bodies accepted for auth"
  - id: "SEC-022"
    category: "Authentication Security & JWT Validation"
    name: "Session Token Revocation On Password Reset"
    description: "Verify tokens are invalidated when user updates password"
    priority: "High"
    expected_result: "Old session tokens become invalid"
  - id: "SEC-023"
    category: "Authentication Security & JWT Validation"
    name: "Multi-Device Session Management"
    description: "Verify multiple valid logins for same user generate unique tokens"
    priority: "Medium"
    expected_result: "Each login receives distinct valid token"
  - id: "SEC-024"
    category: "Authentication Security & JWT Validation"
    name: "Token Entropy & Randomness"
    description: "Verify generated JWT tokens have high entropy and unique jti/signatures"
    priority: "Medium"
    expected_result: "Tokens are cryptographically non-predictable"
  - id: "SEC-025"
    category: "Authentication Security & JWT Validation"
    name: "Auth Error Message Genericity"
    description: "Verify login failure message is generic ('Invalid credentials')"
    priority: "High"
    expected_result: "Error does not reveal whether email or password was wrong"
  - id: "SEC-026"
    category: "Authentication Security & JWT Validation"
    name: "Signup User Enumeration Defense"
    description: "Verify signup responses do not reveal detailed internal user metadata"
    priority: "Medium"
    expected_result: "Clean conflict message returned"
  - id: "SEC-027"
    category: "Authentication Security & JWT Validation"
    name: "Sensitive Data In JWT Payload"
    description: "Inspect decoded JWT claims to ensure no passwords or secrets in payload"
    priority: "Critical"
    expected_result: "JWT payload contains only user id and standard claims"
  - id: "SEC-028"
    category: "Authentication Security & JWT Validation"
    name: "Token Storage LocalStorage Security"
    description: "Inspect web frontend token storage for XSS defensive posture"
    priority: "Medium"
    expected_result: "Frontend uses best practices for token management"
  - id: "SEC-029"
    category: "Authentication Security & JWT Validation"
    name: "Mobile SharedPreferences Security"
    description: "Verify Flutter mobile app stores auth token in secure storage"
    priority: "Medium"
    expected_result: "Token stored in SharedPreferences / FlutterSecureStorage"
  - id: "SEC-030"
    category: "Authentication Security & JWT Validation"
    name: "Session Fixation Prevention"
    description: "Verify authentication regenerates session context and issues fresh token"
    priority: "High"
    expected_result: "Pre-auth tokens cannot access post-auth state"
  - id: "SEC-031"
    category: "Authorization & Access Control"
    name: "IDOR Trip Retrieval Prevention"
    description: "User A attempts to access User B's private trip by ID GET /api/trips/:id"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, cross-user trip access denied"
  - id: "SEC-032"
    category: "Authorization & Access Control"
    name: "IDOR Trip Modification Prevention"
    description: "User A attempts to update User B's trip status PUT /api/trips/:id/status"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, unauthorized modification denied"
  - id: "SEC-033"
    category: "Authorization & Access Control"
    name: "IDOR Trip Deletion Prevention"
    description: "User A attempts to delete User B's trip DELETE /api/trips/:id"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, unauthorized deletion denied"
  - id: "SEC-034"
    category: "Authorization & Access Control"
    name: "IDOR Booking Retrieval Prevention"
    description: "User A attempts to access User B's booking by tripId"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, unauthorized booking access denied"
  - id: "SEC-035"
    category: "Authorization & Access Control"
    name: "IDOR Booking Creation Prevention"
    description: "User A attempts to create booking attached to User B's tripId"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, booking rejected"
  - id: "SEC-036"
    category: "Authorization & Access Control"
    name: "IDOR Expense Retrieval Prevention"
    description: "User A attempts to access expenses for User B's tripId"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, expense access denied"
  - id: "SEC-037"
    category: "Authorization & Access Control"
    name: "IDOR Expense Creation Prevention"
    description: "User A attempts to post expense attached to User B's tripId"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, expense creation rejected"
  - id: "SEC-038"
    category: "Authorization & Access Control"
    name: "IDOR Expense Stats Retrieval Prevention"
    description: "User A attempts to access expense stats for User B's tripId"
    priority: "Critical"
    expected_result: "HTTP 404 or 403 Forbidden, stats access denied"
  - id: "SEC-039"
    category: "Authorization & Access Control"
    name: "IDOR User Profile Update Prevention"
    description: "User A attempts to update User B's profile by injecting { id: 'user_b_id' }"
    priority: "Critical"
    expected_result: "HTTP 401 or update restricted strictly to req.user.id"
  - id: "SEC-040"
    category: "Authorization & Access Control"
    name: "Privilege Escalation Via Body Role Injection"
    description: "User registers with { role: 'admin' } in request body"
    priority: "High"
    expected_result: "Role property ignored or restricted to default user role"
  - id: "SEC-041"
    category: "Authorization & Access Control"
    name: "Privilege Escalation Via Profile Update"
    description: "User sends PUT /api/auth/user with { role: 'admin', isAdmin: true }"
    priority: "High"
    expected_result: "Administrative privilege escalation ignored"
  - id: "SEC-042"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Trips List"
    description: "Attempt GET /api/trips without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-043"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Create Trip"
    description: "Attempt POST /api/trips without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-044"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Single Trip"
    description: "Attempt GET /api/trips/:id without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-045"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Delete Trip"
    description: "Attempt DELETE /api/trips/:id without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-046"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Update Trip Status"
    description: "Attempt PUT /api/trips/:id/status without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-047"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Bookings List"
    description: "Attempt GET /api/bookings without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-048"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Create Booking"
    description: "Attempt POST /api/bookings without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-049"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Trip Expenses"
    description: "Attempt GET /api/expenses/trip/:id without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-050"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Expense Stats"
    description: "Attempt GET /api/expenses/trip/:id/stats without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-051"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Add Expense"
    description: "Attempt POST /api/expenses without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-052"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To User Profile"
    description: "Attempt GET /api/auth/user without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-053"
    category: "Authorization & Access Control"
    name: "Unauthenticated Access To Update Profile"
    description: "Attempt PUT /api/auth/user without token"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized"
  - id: "SEC-054"
    category: "Authorization & Access Control"
    name: "Public Access To Destinations Catalogue"
    description: "Verify GET /api/destinations is accessible without authentication"
    priority: "High"
    expected_result: "HTTP 200 OK, public destination browsing allowed"
  - id: "SEC-055"
    category: "Authorization & Access Control"
    name: "Public Access To Root Health Check"
    description: "Verify GET / is accessible without authentication"
    priority: "High"
    expected_result: "HTTP 200 OK, public health check allowed"
  - id: "SEC-056"
    category: "Authorization & Access Control"
    name: "Public Access To Signup Endpoint"
    description: "Verify POST /api/auth/signup is accessible without authentication"
    priority: "High"
    expected_result: "HTTP 201 or 400, public registration allowed"
  - id: "SEC-057"
    category: "Authorization & Access Control"
    name: "Public Access To Login Endpoint"
    description: "Verify POST /api/auth/login is accessible without authentication"
    priority: "High"
    expected_result: "HTTP 200 or 401, public login allowed"
  - id: "SEC-058"
    category: "Authorization & Access Control"
    name: "HTTP Method Tampering On Protected Routes"
    description: "Attempt HEAD / OPTIONS / TRACE to bypass auth guard"
    priority: "High"
    expected_result: "Auth guard enforces protection regardless of HTTP method"
  - id: "SEC-059"
    category: "Authorization & Access Control"
    name: "Mass Assignment Vulnerability In Trip Creation"
    description: "Send unexpected admin fields in POST /api/trips payload"
    priority: "High"
    expected_result: "Only schema-defined trip fields are persisted"
  - id: "SEC-060"
    category: "Authorization & Access Control"
    name: "Mass Assignment Vulnerability In User Update"
    description: "Send unexpected fields in PUT /api/auth/user payload"
    priority: "High"
    expected_result: "Only permitted user profile fields are updated"
  - id: "SEC-061"
    category: "Session Security & Token Handling"
    name: "Session Expiry Enforcement"
    description: "Verify token cannot be used 1 second after expiration timestamp"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, token expired"
  - id: "SEC-062"
    category: "Session Security & Token Handling"
    name: "Session Token Integrity Check"
    description: "Flip a single bit in the JWT signature and verify rejection"
    priority: "Critical"
    expected_result: "HTTP 401 Unauthorized, signature verification failed"
  - id: "SEC-063"
    category: "Session Security & Token Handling"
    name: "Session Token Structure Validation"
    description: "Submit two-part JWT token (header.payload without signature)"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, malformed token"
  - id: "SEC-064"
    category: "Session Security & Token Handling"
    name: "Session Token Four-Part Reject"
    description: "Submit four-part token to verify structure validation"
    priority: "High"
    expected_result: "HTTP 401 Unauthorized, malformed token"
  - id: "SEC-065"
    category: "Session Security & Token Handling"
    name: "Authorization Header Space Normalization"
    description: "Submit 'Bearer  <token>' with multiple spaces"
    priority: "Medium"
    expected_result: "Server parses token cleanly or rejects gracefully"
  - id: "SEC-066"
    category: "Session Security & Token Handling"
    name: "Authorization Header Case Sensitivity"
    description: "Submit header with mixed case 'bEaReR <token>'"
    priority: "Medium"
    expected_result: "Server handles case-insensitivity cleanly"
  - id: "SEC-067"
    category: "Session Security & Token Handling"
    name: "Session Invalidation On User Delete"
    description: "Verify all sessions terminate if user account is removed"
    priority: "High"
    expected_result: "Subsequent requests return 401 or 404"
  - id: "SEC-068"
    category: "Session Security & Token Handling"
    name: "Session Token Non-Predictability"
    description: "Generate 100 consecutive tokens and check for sequential patterns"
    priority: "High"
    expected_result: "Zero predictable or sequential token structures"
  - id: "SEC-069"
    category: "Session Security & Token Handling"
    name: "Session Storage Plaintext Inspection"
    description: "Inspect mobile device storage to ensure tokens are not world-readable"
    priority: "High"
    expected_result: "App sandbox enforces private file permissions"
  - id: "SEC-070"
    category: "Session Security & Token Handling"
    name: "Session Cookie HttpOnly Flag"
    description: "If cookies are used for auth, verify HttpOnly flag is set"
    priority: "High"
    expected_result: "Cookie cannot be accessed via document.cookie"
  - id: "SEC-071"
    category: "Session Security & Token Handling"
    name: "Session Cookie Secure Flag"
    description: "If cookies are used for auth, verify Secure flag is set"
    priority: "High"
    expected_result: "Cookie only transmitted over HTTPS"
  - id: "SEC-072"
    category: "Session Security & Token Handling"
    name: "Session Cookie SameSite Attribute"
    description: "If cookies are used, verify SameSite=Strict or SameSite=Lax"
    priority: "High"
    expected_result: "Cookie protected against CSRF exploitation"
  - id: "SEC-073"
    category: "Session Security & Token Handling"
    name: "CSRF Protection On State-Changing Endpoints"
    description: "Verify state-changing POST/PUT/DELETE cannot be forged via CSRF"
    priority: "High"
    expected_result: "Bearer token authentication intrinsically protects against CSRF"
  - id: "SEC-074"
    category: "Session Security & Token Handling"
    name: "Replay Attack Resistance"
    description: "Verify replay of modified token is rejected"
    priority: "High"
    expected_result: "Tampered requests rejected"
  - id: "SEC-075"
    category: "Session Security & Token Handling"
    name: "Session Concurrent Logins Policy"
    description: "Verify application handles multiple active sessions per user"
    priority: "Low"
    expected_result: "Multi-device access supported safely"
  - id: "SEC-076"
    category: "Session Security & Token Handling"
    name: "Session Inactivity Timeout"
    description: "Verify token expiration lifetime is bounded (e.g. 7 days max)"
    priority: "Medium"
    expected_result: "JWT expiresIn attribute enforces bounded validity"
  - id: "SEC-077"
    category: "Session Security & Token Handling"
    name: "Token Signing Key Rotation Readiness"
    description: "Verify JWT verification supports key rotation via key ID or env"
    priority: "Low"
    expected_result: "Architecture supports secret key rotation"
  - id: "SEC-078"
    category: "Session Security & Token Handling"
    name: "Token In Query Parameter Rejection"
    description: "Attempt passing auth token as ?token=XYZ in query string"
    priority: "High"
    expected_result: "Server ignores query token for protected routes"
  - id: "SEC-079"
    category: "Session Security & Token Handling"
    name: "Token In Request Body Rejection"
    description: "Attempt passing auth token in JSON body { token: 'XYZ' }"
    priority: "High"
    expected_result: "Server enforces Authorization header strictly"
  - id: "SEC-080"
    category: "Session Security & Token Handling"
    name: "Bearer Token Whitespace Attack"
    description: "Submit token padded with null bytes (%00) or control characters"
    priority: "Medium"
    expected_result: "Server sanitizes and rejects malformed characters"
  - id: "SEC-081"
    category: "Session Security & Token Handling"
    name: "Session Hijacking Prevention via IP/UA"
    description: "Log security warnings when token IP or user agent shifts drastically"
    priority: "Low"
    expected_result: "Anomalous session activity detectable in logs"
  - id: "SEC-082"
    category: "Session Security & Token Handling"
    name: "Token Cryptographic Algorithm Hardening"
    description: "Verify HS256 / RS256 algorithm enforcement in jwt.verify"
    priority: "High"
    expected_result: "jwt.verify specifies allowed algorithms list"
  - id: "SEC-083"
    category: "Session Security & Token Handling"
    name: "Logout Token Purge In Frontend"
    description: "Verify handleLogout removes token from localStorage immediately"
    priority: "High"
    expected_result: "localStorage.getItem('token') returns null post-logout"
  - id: "SEC-084"
    category: "Session Security & Token Handling"
    name: "Logout Token Purge In Mobile"
    description: "Verify mobile logout clears stored token from SharedPreferences"
    priority: "High"
    expected_result: "ApiService._token is set to null post-logout"
  - id: "SEC-085"
    category: "Session Security & Token Handling"
    name: "Session Storage XSS Isolation"
    description: "Verify no third-party scripts have access to localStorage tokens"
    priority: "Medium"
    expected_result: "Clean dependency tree prevents script injection"
  - id: "SEC-086"
    category: "Input Validation & Parameter Tampering"
    name: "Negative Budget Rejection"
    description: "Submit trip planning request with budget: -5000"
    priority: "High"
    expected_result: "HTTP 400 or rejected by validation logic"
  - id: "SEC-087"
    category: "Input Validation & Parameter Tampering"
    name: "Zero Budget Rejection"
    description: "Submit trip planning request with budget: 0"
    priority: "Medium"
    expected_result: "HTTP 400 or validation requires budget > 0"
  - id: "SEC-088"
    category: "Input Validation & Parameter Tampering"
    name: "Negative Travelers Count Rejection"
    description: "Submit trip planning request with travelersCount: -2"
    priority: "High"
    expected_result: "HTTP 400 or rejected by validation logic"
  - id: "SEC-089"
    category: "Input Validation & Parameter Tampering"
    name: "Zero Travelers Count Rejection"
    description: "Submit trip planning request with travelersCount: 0"
    priority: "Medium"
    expected_result: "HTTP 400 or rejected by validation logic"
  - id: "SEC-090"
    category: "Input Validation & Parameter Tampering"
    name: "Excessive Travelers Count Rejection"
    description: "Submit trip planning request with travelersCount: 100000"
    priority: "Medium"
    expected_result: "Validation limits travelers to reasonable range"
  - id: "SEC-091"
    category: "Input Validation & Parameter Tampering"
    name: "Invalid Date Format In Trip"
    description: "Submit startDate: 'invalid-date-string'"
    priority: "High"
    expected_result: "HTTP 400 or rejected, no unhandled 500 error"
  - id: "SEC-092"
    category: "Input Validation & Parameter Tampering"
    name: "End Date Before Start Date Rejection"
    description: "Submit startDate: '2026-05-25' and endDate: '2026-05-20'"
    priority: "High"
    expected_result: "Validation rejects inverted travel dates"
  - id: "SEC-093"
    category: "Input Validation & Parameter Tampering"
    name: "Historic Travel Dates Handling"
    description: "Submit trip dates set 10 years in the past"
    priority: "Low"
    expected_result: "System handles past dates gracefully"
  - id: "SEC-094"
    category: "Input Validation & Parameter Tampering"
    name: "Negative Expense Amount Rejection"
    description: "Submit POST /api/expenses with amount: -1500"
    priority: "High"
    expected_result: "HTTP 400 or rejected by validation logic"
  - id: "SEC-095"
    category: "Input Validation & Parameter Tampering"
    name: "Non-Numeric Expense Amount Rejection"
    description: "Submit POST /api/expenses with amount: 'one thousand'"
    priority: "Medium"
    expected_result: "HTTP 400 Bad Request, amount must be numeric"
  - id: "SEC-096"
    category: "Input Validation & Parameter Tampering"
    name: "Invalid Expense Category Rejection"
    description: "Submit expense with category: 'invalid_category_xyz'"
    priority: "Medium"
    expected_result: "Category validated against permitted enumeration"
  - id: "SEC-097"
    category: "Input Validation & Parameter Tampering"
    name: "Invalid MongoDB ObjectId Format Handling"
    description: "Submit GET /api/trips/not_a_valid_object_id"
    priority: "Critical"
    expected_result: "HTTP 400 or 404, server handles invalid cast without 500 crash"
  - id: "SEC-098"
    category: "Input Validation & Parameter Tampering"
    name: "Null Byte In String Parameters"
    description: "Submit title containing null byte 'Trip%00Title'"
    priority: "High"
    expected_result: "Null byte stripped or rejected cleanly"
  - id: "SEC-099"
    category: "Input Validation & Parameter Tampering"
    name: "Oversized String Input In Trip Title"
    description: "Submit trip title with 10,000 characters"
    priority: "Medium"
    expected_result: "String truncated or rejected without buffer overflow"
  - id: "SEC-100"
    category: "Input Validation & Parameter Tampering"
    name: "Oversized String Input In User Name"
    description: "Submit user name with 5,000 characters"
    priority: "Medium"
