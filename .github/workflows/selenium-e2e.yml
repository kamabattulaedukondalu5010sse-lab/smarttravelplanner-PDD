name: Selenium React Web E2E Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  selenium_web_e2e:
    name: Selenium Cross-Browser E2E Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        browser: [ chrome, firefox ]

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3a. Setup Chrome Browser
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1

      - name: 3b. Setup Firefox Browser
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1

      - name: 4. Install Framework Dependencies & Start Web Application
        env:
          MONGO_URI: ${{ secrets.MONGO_TEST_URI || 'mongodb://127.0.0.1:27017/smart-travel-planner-test' }}
          MONGO_DB_NAME: 'smart-travel-planner-test'
        run: |
          cd backend
          npm install
          npm start &
          echo "Waiting for backend service on port 5000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Backend service is ready!"
              break
            fi
            sleep 1
          done

          cd ../frontend
          npm install
          npm run dev -- --host 127.0.0.1 --port 3000 &
          echo "Waiting for frontend React app on port 3000..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend React web application is ready!"
              break
            fi
            sleep 1
          done

          cd ../selenium-framework
          npm install

      - name: 5. Execute Selenium E2E & Dynamic Route Suite
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
          BASE_URL: "http://127.0.0.1:3000"
        run: |
          cd selenium-framework
          npm test

      - name: 6. Upload Selenium E2E Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-e2e-reports-${{ matrix.browser }}
          path: |
            selenium-framework/reports/
            selenium-framework/logs/

      - name: 7. Teardown & Clean Test Database
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_TEST_URI || 'mongodb://127.0.0.1:27017/smart-travel-planner-test' }}
          MONGO_DB_NAME: 'smart-travel-planner-test'
        run: |
          node -e "
            const mongoose = require('mongoose');
            const uri = process.env.MONGO_URI;
            const dbName = process.env.MONGO_DB_NAME;
            mongoose.connect(uri, { dbName }).then(() => mongoose.connection.db.dropDatabase()).then(() => console.log('Test database dropped successfully')).catch(err => console.log('Teardown notice:', err.message)).finally(() => process.exit(0));
          "
