name: Selenium Web E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      headless:
        description: 'Run in headless mode'
        required: false
        default: 'true'

concurrency:
  group: selenium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium_tests:
    name: Selenium Web E2E Suite (300 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tests/selenium/requirements.txt'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Chrome Browser
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'

      - name: 5. Start Backend API Service
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/smart-travel-planner
          JWT_SECRET: supersecret_jwt_token_12345
        run: |
          cd backend
          npm ci || npm install
          node src/index.js &
          echo "Waiting for backend on port 5000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Backend is healthy!"
              break
            fi
            sleep 1
          done

      - name: 6. Start Frontend React Web Application
        env:
          VITE_API_URL: http://127.0.0.1:5000/api
        run: |
          cd frontend
          npm ci || npm install
          npm run dev -- --host 127.0.0.1 --port 3000 &
          echo "Waiting for frontend on port 3000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:3000/ > /dev/null; then
              echo "Frontend is ready!"
              break
            fi
            sleep 1
          done

      - name: 7. Validate Test Case Definitions
        run: |
          python scripts/validate_test_cases.py

      - name: 8. Install Selenium Test Dependencies
        run: |
          pip install -r tests/selenium/requirements.txt

      - name: 9. Execute Selenium E2E Test Suite (4 Parallel Shards)
        env:
          BASE_URL: http://127.0.0.1:3000
          TEST_USERNAME: john@example.com
          TEST_PASSWORD: anypassword
          HEADLESS: ${{ github.event.inputs.headless || 'true' }}
        run: |
          mkdir -p tests/selenium/reports/screenshots
          pytest tests/selenium \
            -v -n 4 \
            --html=tests/selenium/reports/report.html \
            --self-contained-html \
            --junitxml=tests/selenium/reports/junit.xml

      - name: 10. Generate Step Summary
        if: always()
        run: |
          echo "## 🌐 Selenium Web E2E Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Planned** | 300 (SEL-001 to SEL-300) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Test Runner** | pytest-xdist (4 Shards) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Browser** | Headless Google Chrome |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target** | React Web SPA (http://127.0.0.1:3000) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY

      - name: 11. Upload Selenium Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-test-results
          path: |
            tests/selenium/reports/
