name: Grafana k6 Load Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  k6_load_test:
    name: Run k6 Load Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Start Backend Express API Service
        env:
          MONGO_URI: ${{ secrets.MONGO_TEST_URI || 'mongodb://127.0.0.1:27017/smart-travel-planner-test' }}
          MONGO_DB_NAME: 'smart-travel-planner-test'
        run: |
          cd backend
          npm install
          npm start &
          echo "Waiting for backend service to become healthy..."
          for i in {1..30}; do
            if curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Backend service is up and running!"
              break
            fi
            echo "Waiting for backend on port 5000... ($i/30)"
            sleep 1
          done

      - name: 4. Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: 5. Execute k6 Load Test Suite & Validate Thresholds
        env:
          BASE_URL: "http://127.0.0.1:5000"
          USERNAME: ${{ secrets.LOAD_TEST_USERNAME }}
          PASSWORD: ${{ secrets.LOAD_TEST_PASSWORD }}
        run: |
          mkdir -p load-test-reports
          k6 run --out json=load-test-reports/results.json load-tests/main.js

      - name: 6. Upload Load Test Reports Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-load-test-reports
          path: load-test-reports/

      - name: 7. Teardown & Clean Test Database
        if: always()
        env:
          MONGO_URI: ${{ secrets.MONGO_TEST_URI || 'mongodb://127.0.0.1:27017/smart-travel-planner-test' }}
          MONGO_DB_NAME: 'smart-travel-planner-test'
        run: |
          node -e "
            const mongoose = require('mongoose');
            const uri = process.env.MONGO_URI;
            const dbName = process.env.MONGO_DB_NAME;
            mongoose.connect(uri, { dbName }).then(() => mongoose.connection.db.dropDatabase()).then(() => console.log('Test database dropped successfully')).catch(err => console.log('Teardown notice:', err.message)).finally(() => process.exit(0));
          "
