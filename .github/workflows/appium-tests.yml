name: Appium Mobile Android Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: appium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appium_tests:
    name: Appium Android Mobile Suite (300 Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'tests/appium/requirements.txt'

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 4. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Configure Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/emulator" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: 6. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 7. Start Backend API Service
        env:
          PORT: 5000
          MONGO_URI: mongodb://127.0.0.1:27017/smart-travel-planner
          JWT_SECRET: supersecret_jwt_token_12345
        run: |
          cd backend
          npm ci || npm install
          node src/index.js &
          echo "Waiting for backend on port 5000..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:5000/ > /dev/null; then
              echo "Backend is ready!"
              break
            fi
            sleep 1
          done

      - name: 8. Build Flutter Android Debug APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --debug

      - name: 9. Enable KVM Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then
            sudo chmod 777 /dev/kvm || true
          fi
          ls -la /dev/kvm || true

      - name: 10. Install Appium 2.x & UiAutomator2 Driver
        run: |
          npm install -g appium
          appium driver install uiautomator2
          pip install -r tests/appium/requirements.txt

      - name: 11. Run Appium Tests in Lightweight Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Starting Appium 2.x server in background..."
            mkdir -p tests/appium/logs tests/appium/reports/screenshots
            appium --log tests/appium/logs/appium-server.log &
            
            echo "Waiting for Appium server on port 4723..."
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
                echo "Appium server is listening!"
                break
              fi
              sleep 1
            done

            export APP_PACKAGE="com.smarttravelplanner.mobile"
            export APP_ACTIVITY="com.smarttravelplanner.mobile.MainActivity"
            export APK_PATH="$(pwd)/mobile/build/app/outputs/flutter-apk/app-debug.apk"
            export APPIUM_SERVER_URL="http://127.0.0.1:4723"

            echo "Pre-installing APK on emulator..."
            if [ -f "$APK_PATH" ]; then
              adb install -r "$APK_PATH" || true
            fi

            echo "Executing Appium Mobile Test Suite..."
            pytest tests/appium \
              -v \
              --html=tests/appium/reports/report.html \
              --self-contained-html \
              --junitxml=tests/appium/reports/junit.xml

      - name: 12. Generate Step Summary
        if: always()
        run: |
          echo "## 📱 Appium Mobile Android Test Suite Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Planned** | 300 (APP-001 to APP-300) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Automation Engine** | Appium 2.x + UiAutomator2 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Application ID** | com.smarttravelplanner.mobile |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platform** | Android Emulator (API Level 29) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ✅ Completed |" >> $GITHUB_STEP_SUMMARY

      - name: 13. Upload Appium Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-test-results
          path: |
            tests/appium/reports/
            tests/appium/logs/
