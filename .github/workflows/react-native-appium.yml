name: React Native Appium Android E2E Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  appium_android_e2e:
    name: Appium Android E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 6. Install Appium 2.x Server & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 7. Install Framework Dependencies
        run: |
          cd appium-framework
          npm install

      - name: 8. Run Appium Android Emulator & E2E Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            cd appium-framework
            npm test

      - name: 9. Upload E2E Test Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-react-native-reports
          path: |
            appium-framework/reports/
            appium-framework/logs/