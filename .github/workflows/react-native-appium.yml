name: React Native Appium Android E2E Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  appium_android_e2e:
    name: Appium Android E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 6. Build Flutter Android APK
        run: |
          cd mobile
          flutter pub get
          flutter build apk --debug
          mkdir -p ../appium-framework/app
          cp build/app/outputs/flutter-apk/app-debug.apk ../appium-framework/app/app-release.apk

      - name: 7a. Enable KVM for emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 7b. Verify KVM acceleration availability
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM hardware acceleration device /dev/kvm exists and is accessible!"
            ls -la /dev/kvm
          else
            echo "ERROR: KVM hardware acceleration is NOT available on this runner!"
            exit 1
          fi

      - name: 8. Install Appium 2.x Server & Drivers
        run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 9. Install Framework Dependencies
        run: |
          cd appium-framework
          npm install

      - name: 10a. Cache AVD Snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: avd-30-google_apis-x86_64

      - name: 10b. Run Appium Android Emulator & E2E Tests
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "Starting Appium 2.x server in background..."
            appium --log appium-server.log &
            i=1
            while [ "$i" -le 30 ]; do
              if nc -z 127.0.0.1 4723 2>/dev/null || curl -s http://127.0.0.1:4723/status >/dev/null 2>&1; then
                echo "Appium server is listening on port 4723!"
                break
              fi
              echo "Waiting for Appium server... ($i/30)"
              sleep 2
              i=$((i+1))
            done

            export APP_PACKAGE="com.smarttravelplanner.mobile"
            export APP_ACTIVITY="com.smarttravelplanner.mobile.MainActivity"
            export APK_PATH="$(pwd)/appium-framework/app/app-release.apk"

            cd appium-framework
            npm test

      - name: 11. Upload E2E Test Reports & Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: appium-react-native-reports
          path: |
            appium-framework/reports/
            appium-framework/logs/